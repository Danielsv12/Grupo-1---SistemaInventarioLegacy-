name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "TestPassword123!"
        options: >-
          --health-cmd="/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P TestPassword123! -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 1433:1433

    steps:
    # Checkout v4
    - uses: actions/checkout@v4
    
    # Setup .NET v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    # ========== QUALITY GATE: Architecture Boundaries Tests ==========
    - name: Run architecture boundary tests (ADR-001 Quality Gate)
      run: dotnet test SistemaInventario.Tests/SistemaInventario.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --filter "FullyQualifiedName~SistemaInventario.Tests.Architecture"
      continue-on-error: false
    
    - name: Run unit tests
      run: dotnet test SistemaInventario.Tests/SistemaInventario.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/test-results.trx'

  code-quality:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    # Checkout v4
    - uses: actions/checkout@v4
    
    # Setup .NET v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Install SonarScanner
      run: dotnet tool install --global dotnet-sonarscanner
    
    - name: Build and analyze
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        dotnet sonarscanner begin /k:InventarioLegacy /d:sonar.host.url=https://sonarcloud.io /d:sonar.login=$SONAR_TOKEN
        dotnet build --configuration Release
        dotnet sonarscanner end /d:sonar.login=$SONAR_TOKEN

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    # Checkout v4
    - uses: actions/checkout@v4
    
    # Setup Buildx v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    # Login Action v3
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    # Build-Push Action v5
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/inventario-sistema:latest,${{ secrets.DOCKERHUB_USERNAME }}/inventario-sistema:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
