name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "TestPassword123!"
          MSSQL_SA_PASSWORD: "TestPassword123!"
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P TestPassword123! -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P TestPassword123! -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 1433:1433

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    # ========== QUALITY GATE: Architecture Boundaries Tests ==========
    - name: Run architecture boundary tests (ADR-001 Quality Gate)
      run: dotnet test SistemaInventario.Tests/SistemaInventario.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=arch-test-results.trx" --filter "FullyQualifiedName~SistemaInventario.Tests.Architecture"
      continue-on-error: false
    
    - name: Run unit tests
      run: dotnet test SistemaInventario.Tests/SistemaInventario.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=unit-test-results.trx"
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/*.trx'

