services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: inventario-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourPassword123!"
      SA_PASSWORD: "YourPassword123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - inventario-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourPassword123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    image: inventario-sistema:latest
    container_name: inventario-app
    platform: linux/amd64
    stdin_open: true # Permite la entrada por consola
    tty: true        # Habilita la terminal interactiva para el menú
    ports:
      - "5000:5000"
    environment:
      - DefaultConnection=Server=sqlserver,1433;Database=InventarioDb;User Id=sa;Password=YourPassword123!;Encrypt=false;TrustServerCertificate=true;
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=InventarioDb;User Id=sa;Password=YourPassword123!;Encrypt=false;TrustServerCertificate=true;
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - inventario-net
    restart: on-failure

volumes:
  sqlserver_data:

networks:
  inventario-net:
    driver: bridge